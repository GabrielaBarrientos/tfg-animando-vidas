spring.application.name=backend

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/tfg_animando_vidas
spring.datasource.username=tfg_app
spring.datasource.password=${DB_PASSWORD}

educational-platform.base-url=${EDUCATIONAL_PLATFORM_API_URL:http://127.0.0.1:8000}

# Autenticacion con Google mediante OpenID Connect
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Gestion de sesiones
server.servlet.session.timeout=30m
# Descargas de evidencias (valores iniciales del prototipo, configurables)
evidencias.max-zip-bytes=${EVIDENCIAS_MAX_ZIP_BYTES:524288000}
educational-platform.file-timeout-seconds=${EDUCATIONAL_PLATFORM_FILE_TIMEOUT_SECONDS:120}
